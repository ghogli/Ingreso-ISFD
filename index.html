<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Evaluación y Certificación</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Librería jsPDF para generar el certificado en el navegador sin colapsar el servidor -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col justify-between font-sans transition-colors duration-300">

  <header id="main-header" class="bg-blue-900 text-white shadow-md p-4 transition-colors duration-300">
    <div class="max-w-xl mx-auto">
      <p id="header-subtitulo" class="text-xs uppercase tracking-wider opacity-85 font-semibold"></p>
      <h1 id="header-titulo" class="text-lg font-bold leading-tight">Cargando...</h1>
    </div>
  </header>

  <main class="flex-grow w-full max-w-xl mx-auto px-4 py-6">
    <!-- PANTALLA 0: CARGANDO -->
    <div id="vista-cargando" class="bg-white rounded-2xl shadow p-8 text-center">
      <div class="w-10 h-10 border-4 border-blue-900 border-t-transparent rounded-full animate-spin mx-auto mb-4"></div>
      <p id="texto-cargando">Conectando con la plataforma...</p>
    </div>

    <!-- PANTALLA 1: DATOS -->
    <div id="vista-inicio" class="hidden bg-white rounded-2xl shadow p-6 space-y-4">
      <div>
        <label class="block text-sm font-bold text-slate-700 mb-1">Ingresá tu DNI (sin puntos)</label>
        <input id="input-dni" type="tel" inputmode="numeric" class="w-full px-4 py-3 border-2 rounded-xl focus:border-blue-800 outline-none">
      </div>

      <div id="campos-nuevos" class="hidden space-y-4 pt-2">
        <div>
          <label class="block text-sm font-bold text-slate-700 mb-1">Apellido/s</label>
          <input id="input-apellido" type="text" class="w-full px-4 py-3 border-2 rounded-xl focus:border-blue-800 uppercase outline-none">
        </div>
        <div>
          <label class="block text-sm font-bold text-slate-700 mb-1">Nombre/s</label>
          <input id="input-nombre" type="text" class="w-full px-4 py-3 border-2 rounded-xl focus:border-blue-800 capitalize outline-none">
        </div>
        <div>
          <label class="block text-sm font-bold text-slate-700 mb-1">Correo Electrónico</label>
          <input id="input-correo" type="email" class="w-full px-4 py-3 border-2 rounded-xl focus:border-blue-800 outline-none">
        </div>
        <div>
          <label class="block text-sm font-bold text-slate-700 mb-1">Instituto de Formación Docente (ISFD)</label>
          <select id="input-instituto" class="w-full px-4 py-3 border-2 rounded-xl focus:border-blue-800 bg-white outline-none">
            <option value="">Cargando institutos...</option>
          </select>
        </div>
      </div>

      <button id="btn-verificar" onclick="verificarDNI()" class="w-full bg-blue-900 text-white font-bold py-4 rounded-xl shadow">Continuar</button>
      <button id="btn-comenzar" onclick="comenzarCuestionario()" class="hidden w-full bg-emerald-700 text-white font-bold py-4 rounded-xl shadow">Comenzar Cuestionario</button>
    </div>

    <!-- PANTALLA 2: CUESTIONARIO (Con colores dinámicos) -->
    <div id="vista-preguntas" class="hidden bg-white rounded-2xl shadow border-t-8 border-blue-800 p-5 space-y-5 transition-all duration-300">
      <div class="flex justify-between items-center text-xs font-bold text-slate-500 mb-1">
        <span id="texto-progreso"></span>
        <span id="badge-tipo" class="px-2.5 py-1 rounded-full text-xs font-extrabold uppercase tracking-wide"></span>
      </div>
      <div class="w-full bg-slate-200 h-2.5 rounded-full overflow-hidden">
        <div id="barra-progreso" class="bg-blue-800 h-full transition-all duration-300"></div>
      </div>

      <div id="preg-modulo" class="inline-block text-xs font-bold px-3 py-1 rounded-full"></div>
      <h2 id="preg-enunciado" class="text-base font-bold text-slate-800"></h2>
      
      <div id="contenedor-opciones" class="space-y-3"></div>

      <div id="caja-pista" class="hidden bg-amber-50 border-l-4 border-amber-500 p-4 rounded-r-xl text-sm text-amber-900">
        <p class="font-bold">💡 Pista pedagógica:</p>
        <p id="texto-pista"></p>
      </div>

      <div class="flex gap-3 pt-3">
        <button id="btn-anterior" onclick="irAnterior()" class="w-1/3 py-3.5 bg-slate-200 text-slate-700 font-bold rounded-xl">Atrás</button>
        <button id="btn-siguiente" onclick="validarYAvanzar()" class="w-2/3 py-3.5 bg-blue-900 text-white font-bold rounded-xl transition-colors duration-300">Siguiente</button>
      </div>
    </div>

    <!-- PANTALLA 3: RESULTADO -->
    <div id="vista-final" class="hidden bg-white rounded-2xl shadow p-6 text-center space-y-5">
      <div class="w-16 h-16 bg-emerald-100 text-emerald-700 rounded-full flex items-center justify-center mx-auto text-3xl font-bold">✓</div>
      <h2 class="text-xl font-bold text-slate-800" id="titulo-resultado">¡Completaste el trayecto!</h2>
      <p id="mensaje-resultado" class="text-sm text-slate-600">Tus respuestas fueron registradas. Descargá tu certificado oficial validado por la provincia.</p>
      
      <div id="caja-codigo" class="bg-slate-50 border border-slate-200 rounded-xl p-3 text-xs text-slate-600">
        Código de validación: <strong id="texto-codigo" class="text-slate-900 font-mono text-sm"></strong>
      </div>

      <button id="btn-descargar-pdf" onclick="descargarCertificadoPDF()" class="flex justify-center items-center gap-2 w-full bg-emerald-700 hover:bg-emerald-800 text-white font-bold py-4 rounded-xl shadow-lg cursor-pointer">
        📄 Descargar Certificado (PDF)
      </button>
    </div>
  </main>

  <script>
    // ==========================================
    // PEGAR AQUÍ LA URL DE TU IMPLEMENTACIÓN DE APPS SCRIPT
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyk6WqkrWXRQ8jrTgsYSIYRm-NHJWY7QZTVZFZVJt1CtDl37mGqJhqz5RFyzei2cveC/exec";
    // ==========================================
    
    let configCurso, listaPreguntas, indiceActual = 0, respuestasUsuario = {}, datosAlumno = {}, registroFinal = null;

    // Paletas de colores dinámicas según el tipo/modo de pregunta
    const TEMAS = {
      REPASO: {
        nombre: "Actividad de Repaso",
        header: "bg-amber-600 text-white",
        cardBorder: "border-amber-500",
        progress: "bg-amber-500",
        badge: "bg-amber-100 text-amber-900 border border-amber-300",
        optActive: "border-amber-500 bg-amber-50 text-amber-950 font-bold",
        optBoxActive: "bg-amber-500 text-white",
        btnNext: "bg-amber-600 hover:bg-amber-700 text-white"
      },
      MULTIPLE: {
        nombre: "Opción Múltiple",
        header: "bg-sky-600 text-white",
        cardBorder: "border-sky-500",
        progress: "bg-sky-500",
        badge: "bg-sky-100 text-sky-900 border border-sky-300",
        optActive: "border-sky-500 bg-sky-50 text-sky-950 font-bold",
        optBoxActive: "bg-sky-500 text-white",
        btnNext: "bg-sky-600 hover:bg-sky-700 text-white"
      },
      SIMPLE: {
        nombre: "Selección Simple",
        header: "bg-blue-900 text-white",
        cardBorder: "border-blue-800",
        progress: "bg-blue-800",
        badge: "bg-blue-100 text-blue-900 border border-blue-300",
        optActive: "border-blue-800 bg-blue-50 text-blue-950 font-bold",
        optBoxActive: "bg-blue-800 text-white",
        btnNext: "bg-blue-900 hover:bg-blue-950 text-white"
      }
    };

    function obtenerTemaPregunta(preg) {
      if (preg.modo === 'REPASO') return TEMAS.REPASO;
      if (preg.tipo_control === 'MULTIPLE') return TEMAS.MULTIPLE;
      return TEMAS.SIMPLE;
    }

    window.onload = async () => {
      try {
        const res = await fetch(`${SCRIPT_URL}?action=init`);
        const data = await res.json();
        configCurso = data.config;
        listaPreguntas = data.preguntas;

        const selectInst = document.getElementById('input-instituto');
        selectInst.innerHTML = '<option value="">Seleccioná tu Instituto...</option>';
        if (data.institutos && data.institutos.length > 0) {
          data.institutos.forEach(inst => {
            const opt = document.createElement('option');
            opt.value = inst;
            opt.textContent = inst;
            selectInst.appendChild(opt);
          });
        } else {
          selectInst.innerHTML = '<option value="">No hay institutos cargados</option>';
        }

        document.getElementById('header-titulo').textContent = configCurso.titulo;
        document.getElementById('header-subtitulo').textContent = configCurso.subtitulo;
        mostrarVista('vista-inicio');
      } catch (e) {
        document.getElementById('vista-cargando').innerHTML = "<p class='text-red-600 font-bold'>Error al conectar con el servidor. Intentá recargar la página.</p>";
      }
    };

    async function verificarDNI() {
      const dni = document.getElementById('input-dni').value.replace(/\D/g, '');
      if (dni.length < 7) return alert("Ingresá un DNI válido (sin puntos).");
      
      const btn = document.getElementById('btn-verificar');
      btn.textContent = "Verificando...";
      btn.disabled = true;

      try {
        const res = await fetch(`${SCRIPT_URL}?action=check_dni&dni=${dni}`);
        const data = await res.json();
        
        if (data.encontrado && data.registro) {
          registroFinal = data.registro;
          document.getElementById('texto-codigo').textContent = registroFinal.codigo_certificado;
          document.getElementById('titulo-resultado').textContent = "Certificado recuperado";
          document.getElementById('mensaje-resultado').textContent = `Hola ${registroFinal.nombre}, ya completaste este trayecto anteriormente. Podés volver a descargar tu certificado oficial.`;
          mostrarVista('vista-final');
        } else {
          document.getElementById('input-dni').disabled = true;
          document.getElementById('campos-nuevos').classList.remove('hidden');
          btn.classList.add('hidden');
          document.getElementById('btn-comenzar').classList.remove('hidden');
        }
      } catch (err) {
        alert("Hubo un problema al verificar el DNI. Intentá de nuevo.");
        btn.textContent = "Continuar";
        btn.disabled = false;
      }
    }

    function comenzarCuestionario() {
      datosAlumno = {
        dni: document.getElementById('input-dni').value.replace(/\D/g, ''),
        apellido: document.getElementById('input-apellido').value.trim().toUpperCase(),
        nombre: document.getElementById('input-nombre').value.trim(),
        correo: document.getElementById('input-correo').value.trim(),
        instituto: document.getElementById('input-instituto').value
      };
      if (!datosAlumno.apellido || !datosAlumno.nombre || !datosAlumno.instituto) {
        return alert("Por favor completá tu apellido, nombre y seleccioná tu instituto.");
      }
      mostrarVista('vista-preguntas');
      renderizarPregunta();
    }

    function renderizarPregunta() {
      const preg = listaPreguntas[indiceActual];
      const tema = obtenerTemaPregunta(preg);
      const pct = Math.round(((indiceActual + 1) / listaPreguntas.length) * 100);

      // Aplicar colores del tema según tipo de pregunta
      document.getElementById('main-header').className = `${tema.header} shadow-md p-4 transition-colors duration-300`;
      document.getElementById('vista-preguntas').className = `bg-white rounded-2xl shadow border-t-8 ${tema.cardBorder} p-5 space-y-5 transition-all duration-300`;
      document.getElementById('barra-progreso').className = `${tema.progress} h-full transition-all duration-300`;
      document.getElementById('barra-progreso').style.width = `${pct}%`;
      
      const badgeTipo = document.getElementById('badge-tipo');
      badgeTipo.className = `px-2.5 py-1 rounded-full text-xs font-extrabold uppercase tracking-wide ${tema.badge}`;
      badgeTipo.textContent = tema.nombre;

      const pregModulo = document.getElementById('preg-modulo');
      pregModulo.className = `inline-block text-xs font-bold px-3 py-1 rounded-full ${tema.badge}`;
      pregModulo.textContent = preg.modulo;

      document.getElementById('texto-progreso').textContent = `Pregunta ${indiceActual + 1} de ${listaPreguntas.length}`;
      document.getElementById('preg-enunciado').textContent = preg.enunciado;
      document.getElementById('caja-pista').classList.add('hidden');
      
      const cont = document.getElementById('contenedor-opciones');
      cont.innerHTML = '';
      const selec = respuestasUsuario[preg.nro] || [];
      
      preg.opciones.forEach(op => {
        const btn = document.createElement('button');
        const activa = selec.includes(op.letra);
        btn.className = `w-full text-left p-4 rounded-xl border-2 flex items-start gap-3 transition-all ${activa ? tema.optActive : 'border-slate-200 hover:bg-slate-50'}`;
        btn.onclick = () => {
          if (preg.tipo_control === 'MULTIPLE') {
            if (selec.includes(op.letra)) respuestasUsuario[preg.nro] = selec.filter(l => l !== op.letra);
            else respuestasUsuario[preg.nro] = [...selec, op.letra];
          } else {
            respuestasUsuario[preg.nro] = [op.letra];
          }
          renderizarPregunta();
        };
        btn.innerHTML = `<span class="w-6 h-6 shrink-0 flex justify-center items-center rounded font-bold text-sm ${activa ? tema.optBoxActive : 'bg-slate-200 text-slate-700'}">${op.letra}</span><span>${op.texto}</span>`;
        cont.appendChild(btn);
      });

      document.getElementById('btn-anterior').style.visibility = indiceActual === 0 ? 'hidden' : 'visible';
      const btnSig = document.getElementById('btn-siguiente');
      btnSig.className = `w-2/3 py-3.5 font-bold rounded-xl transition-colors duration-300 ${tema.btnNext}`;
      btnSig.textContent = indiceActual === listaPreguntas.length - 1 ? 'Finalizar y Certificar' : 'Siguiente';
    }

    function validarYAvanzar() {
      const preg = listaPreguntas[indiceActual];
      const selec = respuestasUsuario[preg.nro] || [];
      if (selec.length === 0) return alert("Seleccioná al menos una opción para continuar.");

      if (preg.modo === 'REPASO' && preg.correctas.length > 0) {
        const ok = selec.length === preg.correctas.length && selec.every(m => preg.correctas.includes(m));
        if (!ok) {
          document.getElementById('caja-pista').classList.remove('hidden');
          document.getElementById('texto-pista').textContent = preg.pista || "Revisá tu respuesta e intentá nuevamente.";
          return;
        }
      }

      if (indiceActual < listaPreguntas.length - 1) {
        indiceActual++;
        renderizarPregunta();
      } else {
        enviarFinal();
      }
    }

    function irAnterior() {
      if (indiceActual > 0) {
        indiceActual--;
        renderizarPregunta();
      }
    }

    async function enviarFinal() {
      document.getElementById('main-header').className = "bg-blue-900 text-white shadow-md p-4 transition-colors duration-300";
      mostrarVista('vista-cargando');
      document.getElementById('texto-cargando').textContent = "Registrando tus respuestas y generando tu certificado...";
      
      // Transformar las respuestas elegidas en el TEXTO real para que en Google Sheets quede listo para graficar
      const respuestasColumnas = listaPreguntas.map(preg => {
        const letrasElegidas = respuestasUsuario[preg.nro] || [];
        const textosElegidos = letrasElegidas.map(letra => {
          const opObj = preg.opciones.find(o => o.letra === letra);
          return opObj ? `${letra}) ${opObj.texto}` : letra;
        });
        return textosElegidos.join(" | ");
      });

      try {
        const res = await fetch(SCRIPT_URL, {
          method: 'POST',
          body: JSON.stringify({
            ...datosAlumno,
            nota: 100,
            estado: 'APROBADO',
            respuestas_columnas: respuestasColumnas
          })
        });
        const data = await res.json();
        
        if (!data.ok) throw new Error(data.error || "Error al guardar");

        registroFinal = data.registro;
        document.getElementById('texto-codigo').textContent = registroFinal.codigo_certificado;
        mostrarVista('vista-final');
      } catch (err) {
        alert("Ocurrió un error al guardar tus respuestas: " + err.message + ". Por favor intentá nuevamente.");
        mostrarVista('vista-preguntas');
      }
    }

    // Genera el certificado PDF instantáneamente en el celular/PC del alumno sin usar cuota de Google Drive
    function descargarCertificadoPDF() {
      if (!registroFinal) return;
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({ orientation: "landscape", unit: "mm", format: "a4" });

      // Marco decorativo institucional
      doc.setDrawColor(30, 58, 138); // Azul oscuro
      doc.setLineWidth(3);
      doc.rect(10, 10, 277, 190);
      doc.setDrawColor(2, 132, 199); // Celeste
      doc.setLineWidth(0.8);
      doc.rect(14, 14, 269, 182);

      // Encabezado Institucional
      doc.setFont("helvetica", "bold");
      doc.setFontSize(13);
      doc.setTextColor(71, 85, 105);
      doc.text((configCurso.subtitulo || "PROVINCIA DE MISIONES").toUpperCase(), 148.5, 34, { align: "center" });

      // Título del Certificado
      doc.setFontSize(26);
      doc.setTextColor(30, 58, 138);
      doc.text("CERTIFICADO DE REALIZACIÓN", 148.5, 52, { align: "center" });

      // Cuerpo del Certificado
      doc.setFont("helvetica", "normal");
      doc.setFontSize(14);
      doc.setTextColor(51, 65, 85);
      doc.text("Por medio del presente se deja constancia de que:", 148.5, 72, { align: "center" });

      // Nombre y Apellido del Alumno
      doc.setFont("helvetica", "bold");
      doc.setFontSize(22);
      doc.setTextColor(15, 23, 42);
      doc.text(`${registroFinal.apellido}, ${registroFinal.nombre}`.toUpperCase(), 148.5, 88, { align: "center" });

      // DNI
      doc.setFont("helvetica", "normal");
      doc.setFontSize(14);
      doc.setTextColor(51, 65, 85);
      doc.text(`DNI N°: ${registroFinal.dni}`, 148.5, 99, { align: "center" });

      // Trayecto e Instituto
      doc.text("ha completado satisfactoriamente las actividades correspondientes al", 148.5, 115, { align: "center" });
      
      doc.setFont("helvetica", "bold");
      doc.setFontSize(17);
      doc.setTextColor(30, 58, 138);
      doc.text(`"${configCurso.titulo}"`, 148.5, 126, { align: "center" });

      doc.setFont("helvetica", "normal");
      doc.setFontSize(13);
      doc.setTextColor(51, 65, 85);
      doc.text(`Instituto: ${registroFinal.instituto}`, 148.5, 140, { align: "center" });

      // Pie de página con Fecha y Código Único
      doc.setDrawColor(203, 213, 225);
      doc.setLineWidth(0.5);
      doc.line(35, 165, 262, 165);

      doc.setFontSize(10);
      doc.setTextColor(100, 116, 139);
      doc.text(`Fecha de emisión: ${registroFinal.fecha}`, 35, 175);
      doc.setFont("helvetica", "bold");
      doc.text(`Código de validación único: ${registroFinal.codigo_certificado}`, 262, 175, { align: "right" });

      doc.save(`Certificado_${registroFinal.dni}.pdf`);
    }

    function mostrarVista(id) {
      ['vista-cargando', 'vista-inicio', 'vista-preguntas', 'vista-final'].forEach(v => document.getElementById(v).classList.add('hidden'));
      document.getElementById(id).classList.remove('hidden');
    }
  </script>
</body>
</html>
